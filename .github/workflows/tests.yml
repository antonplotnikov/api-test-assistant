name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Логика (без сети)
        run: npm test

      - name: Логика + реальные запросы к jsonplaceholder
        run: npm run test:network

      - name: Запуск страницы
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done

      - name: Браузерные тесты (Chrome)
        run: npm run test:e2e
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://127.0.0.1:8765/
